<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>Korea Trip Data랩 - 관광 대시보드 (오프라인/정적 실행 버전)</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.59.0/build/style.css"
    />
    <style>
      /* 로딩 spinner 디자인 */
      #spinner-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #f7f9fa;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }
      .spinner {
        border: 4px solid rgba(0, 0, 0, 0.1);
        width: 50px;
        height: 50px;
        border-radius: 50%;
        border-left-color: #00c73c;
        animation: spin 1s linear infinite;
        margin-bottom: 20px;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .loading-text {
        font-size: 1.1rem;
        color: #333;
        font-weight: 600;
      }
      .sub-text {
        font-size: 0.85rem;
        color: #666;
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <div id="spinner-container">
      <div class="spinner"></div>
      <div class="loading-text">Korea Trip Data랩 대시보드 로딩 중...</div>
      <div class="sub-text">웹브라우저 내부에서 파이썬 가상환경(Pyodide)을 구동하고 있습니다. 최초 로딩 시 약 10~20초 정도 소요됩니다.</div>
    </div>
    <div id="root"></div>
    <script src="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.59.0/build/stlite.js"></script>
    <script>
      // stlite 렌더링 감지 시 로딩 스피너 숨기기
      const observer = new MutationObserver((mutations, obs) => {
        const streamlitRoot = document.querySelector('.stApp');
        if (streamlitRoot) {
          const spinner = document.getElementById('spinner-container');
          if (spinner) {
            spinner.style.display = 'none';
          }
          obs.disconnect();
        }
      });
      observer.observe(document.body, {
        childList: true,
        subtree: true
      });

      stlite.mount({
        requirements: ["pandas", "plotly", "requests", "python-dotenv", "koreanize-matplotlib", "matplotlib", "tabulate"],
        entrypoint: "app.py",
        files: {"app.py": "\"\"\"\n외래 관광객 트렌드 및 지역 관광 활성화를 위한 Streamlit 대시보드의 메인 진입점(App)입니다.\n\n주요 기능:\n- 프로젝트의 기획 의도 및 5단계 분석 프레임워크 소개\n- 방한 외래객 주요 통계 요약 (KPI 카드)\n- 다중 페이지(Multi-page) 내비게이션 지원 및 공통 레이아웃 설정\n\"\"\"\n\nimport os\nimport sys\nimport streamlit as st\nimport pandas as pd\nimport plotly.express as px\n\n# 프로젝트 루트 경로 추가\nsys.path.append(os.path.dirname(os.path.dirname(os.path.abspath(__file__))))\n\nfrom api.odcloud_api import get_foreigner_monthly_data\n\n# 페이지 환경설정 (고급 에스테틱 테마 적용)\nst.set_page_config(\n    page_title=\"Korea Trip Data랩 - 관광 대시보드\",\n    page_icon=\"🗺️\",\n    layout=\"wide\",\n    initial_sidebar_state=\"expanded\"\n)\n\n# 메인 헤더\nst.title(\"🗺️ Korea Trip Data랩\")\nst.subheader(\"인바운드 관광 트렌드 및 지역 관광 활성화 분석 대시보드\")\nst.markdown(\"---\")\n\n# 기획 의도 소개 (Rich UI 카드 형태)\nst.markdown(\"\"\"\n### 🎯 프로젝트 기획 의도\n방한 외국인 관광객들의 **특정 대도시(서울, 제주 등) 편중 현상**을 해결하고, 잠재력 있는 지역 도시들의 관광 활성화를 모색합니다.\n본 대시보드는 온라인 상의 **관심도(SNS/검색)**와 오프라인의 **실제 행동(내비게이션 행선지/신용카드 소비)** 데이터를 융합하여 분석을 전개합니다.\n\"\"\")\n\n# 5단계 분석 프레임워크 요약 안내\ncol_step1, col_step2, col_step3, col_step4, col_step5 = st.columns(5)\nwith col_step1:\n    st.info(\"**1단계: 관심도 분석**\\n\\n외국인이 주목하는 인기 관심 도시 랭킹 파악\")\nwith col_step2:\n    st.info(\"**2단계: 실제 방문 대조**\\n\\n온라인의 관심이 오프라인 방문으로 연결되는지 분석\")\nwith col_step3:\n    st.info(\"**3단계: 도시 매트릭스**\\n\\n성공 도시(도시1) vs 잠재 도시(도시2) 분류\")\nwith col_step4:\n    st.info(\"**4단계: 인프라 분석**\\n\\n소비 패턴 및 연령/국적별 다양성 격차 규명\")\nwith col_step5:\n    st.info(\"**5단계: 벤치마킹**\\n\\n성공 요소를 바탕으로 한 활성화 솔루션 도출\")\n\nst.markdown(\"---\")\n\n# 메인 요약 KPI (방한 외래객 통계 연동)\nst.markdown(\"### 📊 방한 외래객 유입 현황 요약 (API 1 연동)\")\ndf_foreigner = get_foreigner_monthly_data()\n\nif not df_foreigner.empty:\n    # 2024년 데이터 추출\n    df_2024 = df_foreigner[df_foreigner[\"기준연월\"].str.startswith(\"2024\", na=False)]\n    total_foreigner_2024 = df_2024[\"인원수\"].sum()\n    \n    # 2023년 데이터 추출 및 증감율 계산\n    df_2023 = df_foreigner[df_foreigner[\"기준연월\"].str.startswith(\"2023\", na=False)]\n    total_foreigner_2023 = df_2023[\"인원수\"].sum()\n    \n    growth_rate = ((total_foreigner_2024 - total_foreigner_2023) / total_foreigner_2023) * 100 if total_foreigner_2023 > 0 else 0\n    \n    # 대표 목적지 (가장 많은 목적/성별/연령)\n    top_purpose = df_foreigner.groupby(\"목적별\")[\"인원수\"].sum().idxmax()\n    top_age = df_foreigner.groupby(\"연령별\")[\"인원수\"].sum().idxmax()\n    \n    # KPI 3열 구성\n    kpi_col1, kpi_col2, kpi_col3 = st.columns(3)\n    with kpi_col1:\n        st.metric(\n            label=\"2024년 방한 외래객 총수\", \n            value=f\"{total_foreigner_2024:,.0f} 명\", \n            delta=f\"전년 대비 {growth_rate:.1f}% 증가\" if growth_rate > 0 else f\"{growth_rate:.1f}%\"\n        )\n    with kpi_col2:\n        st.metric(label=\"핵심 입국 목적\", value=top_purpose)\n    with kpi_col3:\n        st.metric(label=\"주요 방문 연령층\", value=top_age)\n\n    # 간단한 라인 차트 시각화\n    st.markdown(\"#### 월별 외래 관광객 유입 추이\")\n    df_trend = df_foreigner.groupby(\"기준연월\")[\"인원수\"].sum().reset_index()\n    fig = px.line(\n        df_trend, x=\"기준연월\", y=\"인원수\", \n        title=\"방한 외래객 월별 추이 (2023-2024)\",\n        labels={\"인원수\": \"관광객 수(명)\", \"기준연월\": \"연월\"},\n        markers=True,\n        color_discrete_sequence=[\"#2E86C1\"]\n    )\n    fig.update_layout(hovermode=\"x unified\", plot_bgcolor=\"rgba(0,0,0,0)\")\n    st.plotly_chart(fig, use_container_width=True)\nelse:\n    st.warning(\"방한 외래객 데이터를 불러올 수 없습니다.\")\n\nst.markdown(\"---\")\nst.markdown(\"👈 왼쪽 사이드바 메뉴를 통해 **방한 트렌드**, **도시 분류 매트릭스**, **도시 1:1 심층 비교** 페이지로 이동하여 상세 분석을 시작해 보세요!\")\n", "api/__init__.py": "# API 호출 패키지 초기화 파일\n", "api/odcloud_api.py": "\"\"\"\nODCloud 방한 외래관광객 통계 API 연동 모듈입니다.\n\n주요 기능:\n- 한국관광공사 방한 외래관광객 상세 월별 집계 API 호출 및 데이터 가공\n- Streamlit Caching 적용을 통한 성능 최적화\n- API 호출 실패 시 대안 데이터(Mock) 제공\n\"\"\"\n\nimport os\nimport requests\nimport pandas as pd\nimport streamlit as st\nfrom dotenv import load_dotenv\n\n# .env 파일 로드\nload_dotenv()\n\nODCLOUD_API_KEY = os.getenv(\"ODCLOUD_API_KEY\")\nODCLOUD_BASE_URL = os.getenv(\"ODCLOUD_BASE_URL\", \"https://api.odcloud.kr/api\")\n\n@st.cache_data(show_spinner=\"방한 외래객 데이터를 불러오는 중...\")\ndef get_foreigner_monthly_data(page: int = 1, per_page: int = 10000) -> pd.DataFrame:\n    \"\"\"\n    방한 외래관광객 상세 월별 집계 데이터를 호출하여 Pandas DataFrame으로 반환합니다.\n    API 호출에 실패할 경우, 시각화 검증을 위한 Mock 데이터를 생성하여 반환합니다.\n    \"\"\"\n    url = f\"{ODCLOUD_BASE_URL}/15136774/v1/uddi:ef3ac703-f138-45ec-a09d-f1f57eade496\"\n    \n    params = {\n        \"serviceKey\": ODCLOUD_API_KEY,\n        \"page\": page,\n        \"perPage\": per_page,\n        \"returnType\": \"JSON\"\n    }\n    \n    try:\n        response = requests.get(url, params=params, timeout=10)\n        response.encoding = \"utf-8\"\n        if response.status_code == 200:\n            res_data = response.json()\n            if \"data\" in res_data:\n                df = pd.DataFrame(res_data[\"data\"])\n                # 컬럼명 매핑 정규화 (필요시)\n                # API 명세 상 컬럼: 기준연월, 성별, 연령별, 목적별, 교통수단별, 인원수\n                return df\n            \n        print(f\"[ODCloud API Error] Status Code: {response.status_code}\")\n    except Exception as e:\n        print(f\"[ODCloud API Connection Error]: {e}\")\n        \n    # API 실패 시 시뮬레이션을 위한 Mock 데이터 생성\n    print(\"[ODCloud API] 호출 실패로 인해 테스트용 Mock 데이터를 로드합니다.\")\n    return _generate_mock_foreigner_data()\n\ndef _generate_mock_foreigner_data() -> pd.DataFrame:\n    \"\"\"\n    API 호출 실패 시 사용할 2023-2024년 방한 외래관광객 Mock 데이터를 생성합니다.\n    \"\"\"\n    import numpy as np\n    \n    dates = pd.date_range(start=\"2023-01-01\", end=\"2024-12-01\", freq=\"MS\")\n    countries = [\"중국\", \"일본\", \"미국\", \"대만\", \"홍콩\", \"기타\"]\n    genders = [\"여성\", \"남성\"]\n    ages = [\"20대 이하\", \"20대\", \"30대\", \"40대\", \"50대\", \"60대 이상\"]\n    purposes = [\"관광\", \"상용\", \"공무\", \"유학/연수\", \"기타\"]\n    transports = [\"항공\", \"선박\"]\n    \n    rows = []\n    np.random.seed(42)\n    \n    for date in dates:\n        date_str = date.strftime(\"%Y-%m-%d\")\n        for country in countries:\n            for gender in genders:\n                for age in ages:\n                    # 국가별/조건별 관광객 수 가중치 부여\n                    base_cnt = 500\n                    if country == \"일본\":\n                        base_cnt = 1200\n                    elif country == \"중국\":\n                        base_cnt = 1000\n                    elif country == \"미국\":\n                        base_cnt = 700\n                    \n                    if age in [\"20대\", \"30대\"]:\n                        base_cnt = int(base_cnt * 1.5)\n                        \n                    people_count = int(np.random.poisson(base_cnt))\n                    \n                    rows.append({\n                        \"기준연월\": date_str,\n                        \"국적\": country,\n                        \"성별\": gender,\n                        \"연령별\": age,\n                        \"목적별\": np.random.choice(purposes, p=[0.7, 0.05, 0.02, 0.08, 0.15]),\n                        \"교통수단별\": np.random.choice(transports, p=[0.85, 0.15]),\n                        \"인원수\": people_count\n                    })\n                    \n    return pd.DataFrame(rows)\n", "api/kto_api.py": "\"\"\"\n한국관광공사 지역별 관광 다양성 및 자원 수요 API 연동 모듈입니다.\n\n주요 기능:\n- AreaTarDivService (관광객, 소비, 국제 다양성) API 데이터 연동\n- AreaTarResDemService (서비스 수요, 문화 자원 수요) API 데이터 연동\n- Streamlit Caching 기능을 이용한 실시간 로딩 최적화\n- API 호출 실패(404 등) 시 기획 시나리오 검증용 고품질 Mock 데이터(도시 1 vs 도시 2 특징 탑재) 자동 생성\n\"\"\"\n\nimport os\nimport requests\nimport pandas as pd\nimport streamlit as st\nfrom dotenv import load_dotenv\n\n# .env 로드\nload_dotenv()\n\nKTO_API_KEY = os.getenv(\"KTO_API_KEY\")\nKTO_DIV_ENDPOINT = os.getenv(\"KTO_DIV_ENDPOINT\", \"https://apis.data.go.kr/B551011/AreaTarDivService\")\nKTO_DEM_ENDPOINT = os.getenv(\"KTO_DEM_ENDPOINT\", \"https://apis.data.go.kr/B551011/AreaTarResDemService\")\n\ndef _request_kto_api(base_url: str, operation: str, params: dict) -> list:\n    \"\"\"\n    공공데이터포털 한국관광공사 API를 호출하는 공통 헬퍼 함수입니다.\n    \"\"\"\n    url = f\"{base_url}/{operation}\"\n    full_params = {\n        \"serviceKey\": KTO_API_KEY,\n        \"numOfRows\": 1000,\n        \"pageNo\": 1,\n        \"MobileOS\": \"ETC\",\n        \"MobileApp\": \"AppTest\",\n        \"_type\": \"json\"\n    }\n    full_params.update(params)\n    \n    try:\n        response = requests.get(url, params=full_params, timeout=10)\n        if response.status_code == 200:\n            res_json = response.json()\n            # 공공데이터포털 표준 response 구조 파싱\n            body = res_json.get(\"response\", {}).get(\"body\", {})\n            items = body.get(\"items\", {})\n            if isinstance(items, dict) and \"item\" in items:\n                item_list = items[\"item\"]\n                return item_list if isinstance(item_list, list) else [item_list]\n        print(f\"[KTO API Error] {operation} Status Code: {response.status_code}\")\n    except Exception as e:\n        print(f\"[KTO API Connection Error] {operation}: {e}\")\n    return []\n\n@st.cache_data(show_spinner=\"지역별 관광 다양성 데이터를 불러오는 중...\")\ndef get_area_visitor_diversity(base_ym: str = \"202401\") -> pd.DataFrame:\n    \"\"\"\n    지역별 관광객 다양성 정보(연령별 방문자 등)를 조회합니다.\n    \"\"\"\n    params = {\"baseYm\": base_ym}\n    items = _request_kto_api(KTO_DIV_ENDPOINT, \"getAreaVisitorDivList\", params)\n    if items:\n        return pd.DataFrame(items)\n    \n    print(\"[KTO API] getAreaVisitorDivList 호출 실패로 Mock 데이터를 제공합니다.\")\n    return _generate_mock_visitor_div_data(base_ym)\n\n@st.cache_data(show_spinner=\"지역별 관광 소비 다양성 데이터를 불러오는 중...\")\ndef get_area_spend_diversity(base_ym: str = \"202401\") -> pd.DataFrame:\n    \"\"\"\n    지역별 관광 소비 다양성 정보(업종별/연령별 소비액)를 조회합니다.\n    \"\"\"\n    params = {\"baseYm\": base_ym}\n    items = _request_kto_api(KTO_DIV_ENDPOINT, \"getAreaSpendDivList\", params)\n    if items:\n        return pd.DataFrame(items)\n    \n    print(\"[KTO API] getAreaSpendDivList 호출 실패로 Mock 데이터를 제공합니다.\")\n    return _generate_mock_spend_div_data(base_ym)\n\n@st.cache_data(show_spinner=\"지역별 국제 다양성 데이터를 불러오는 중...\")\ndef get_area_intl_diversity(base_ym: str = \"202401\") -> pd.DataFrame:\n    \"\"\"\n    지역별 국제 다양성 정보(외국인 소비 및 방문 국적 다양성)를 조회합니다.\n    \"\"\"\n    params = {\"baseYm\": base_ym}\n    items = _request_kto_api(KTO_DIV_ENDPOINT, \"getAreaIntlDivList\", params)\n    if items:\n        return pd.DataFrame(items)\n    \n    print(\"[KTO API] getAreaIntlDivList 호출 실패로 Mock 데이터를 제공합니다.\")\n    return _generate_mock_intl_div_data(base_ym)\n\n@st.cache_data(show_spinner=\"지역별 관광 서비스 수요 데이터를 불러오는 중...\")\ndef get_area_service_demand(base_ym: str = \"202401\") -> pd.DataFrame:\n    \"\"\"\n    지역별 관광 서비스 수요 정보(SNS 언급량, 검색량 등 관심도)를 조회합니다.\n    \"\"\"\n    params = {\"baseYm\": base_ym}\n    items = _request_kto_api(KTO_DEM_ENDPOINT, \"getAreaServDemList\", params)\n    if items:\n        return pd.DataFrame(items)\n    \n    print(\"[KTO API] getAreaServDemList 호출 실패로 Mock 데이터를 제공합니다.\")\n    return _generate_mock_service_demand_data(base_ym)\n\n@st.cache_data(show_spinner=\"지역별 문화 자원 수요 데이터를 불러오는 중...\")\ndef get_area_cultural_demand(base_ym: str = \"202401\") -> pd.DataFrame:\n    \"\"\"\n    지역별 문화 자원 수요 정보(내비게이션 유형별 목적지 검색량)를 조회합니다.\n    \"\"\"\n    params = {\"baseYm\": base_ym}\n    items = _request_kto_api(KTO_DEM_ENDPOINT, \"getAreaCultDemList\", params)\n    if items:\n        return pd.DataFrame(items)\n    \n    print(\"[KTO API] getAreaCultDemList 호출 실패로 Mock 데이터를 제공합니다.\")\n    return _generate_mock_cultural_demand_data(base_ym)\n\n\n# ==========================================\n# Mock 데이터 생성기 (도시 1 vs 도시 2 가중치 시나리오 탑재)\n# ==========================================\n\n# 가상의 시군구 목록 및 관심도-방문도 유형 정의\n# 도시 1: 관심도(SNS)도 높고, 실제 방문/소비도 높음 (성공)\n# 도시 2: 관심도(SNS)는 높으나, 실제 방문/소비는 낮음 (개선 대상)\nCITIES = [\n    {\"signguCd\": \"11110\", \"signguNm\": \"서울 종로구\", \"type\": \"도시1\", \"sns_weight\": 1.5, \"visit_weight\": 1.5, \"spend_weight\": 1.4},\n    {\"signguCd\": \"11440\", \"signguNm\": \"서울 마포구\", \"type\": \"도시1\", \"sns_weight\": 1.8, \"visit_weight\": 1.7, \"spend_weight\": 1.6},\n    {\"signguCd\": \"26000\", \"signguNm\": \"부산 해운대구\", \"type\": \"도시1\", \"sns_weight\": 1.6, \"visit_weight\": 1.5, \"spend_weight\": 1.5},\n    {\"signguCd\": \"39110\", \"signguNm\": \"제주 제주시\", \"type\": \"도시1\", \"sns_weight\": 1.7, \"visit_weight\": 1.6, \"spend_weight\": 1.5},\n    \n    {\"signguCd\": \"32170\", \"signguNm\": \"강원 삼척시\", \"type\": \"도시2\", \"sns_weight\": 1.3, \"visit_weight\": 0.5, \"spend_weight\": 0.4},\n    {\"signguCd\": \"37110\", \"signguNm\": \"경북 안동시\", \"type\": \"도시2\", \"sns_weight\": 1.4, \"visit_weight\": 0.6, \"spend_weight\": 0.5},\n    {\"signguCd\": \"36110\", \"signguNm\": \"전남 여수시\", \"type\": \"도시2\", \"sns_weight\": 1.5, \"visit_weight\": 0.7, \"spend_weight\": 0.6},\n    {\"signguCd\": \"31110\", \"signguNm\": \"경기 수원시\", \"type\": \"도시2\", \"sns_weight\": 1.2, \"visit_weight\": 0.8, \"spend_weight\": 0.7},\n    \n    # 일반 대조군 도시들\n    {\"signguCd\": \"31140\", \"signguNm\": \"경기 성남시\", \"type\": \"일반\", \"sns_weight\": 0.9, \"visit_weight\": 1.0, \"spend_weight\": 1.1},\n    {\"signguCd\": \"32010\", \"signguNm\": \"강원 춘천시\", \"type\": \"일반\", \"sns_weight\": 1.1, \"visit_weight\": 1.0, \"spend_weight\": 0.9},\n    {\"signguCd\": \"34110\", \"signguNm\": \"충남 천안시\", \"type\": \"일반\", \"sns_weight\": 0.8, \"visit_weight\": 0.8, \"spend_weight\": 0.8},\n    {\"signguCd\": \"35110\", \"signguNm\": \"전북 전주시\", \"type\": \"일반\", \"sns_weight\": 1.2, \"visit_weight\": 1.1, \"spend_weight\": 1.0},\n    {\"signguCd\": \"38110\", \"signguNm\": \"경남 창원시\", \"type\": \"일반\", \"sns_weight\": 0.7, \"visit_weight\": 0.7, \"spend_weight\": 0.8}\n]\n\ndef _generate_mock_visitor_div_data(base_ym: str) -> pd.DataFrame:\n    \"\"\"\n    지역별 관광객 다양성 Mock 데이터를 생성합니다.\n    \"\"\"\n    import numpy as np\n    np.random.seed(int(base_ym))\n    rows = []\n    for city in CITIES:\n        # 연령대별 방문객 분포\n        base_visitors = 50000 * city[\"visit_weight\"]\n        ages = [\"20대 이하\", \"20대\", \"30대\", \"40대\", \"50대\", \"60대 이상\"]\n        \n        # 도시 1은 청년층 비중이 높음\n        if city[\"type\"] == \"도시1\":\n            probs = [0.15, 0.35, 0.25, 0.12, 0.08, 0.05]\n        else:\n            probs = [0.10, 0.15, 0.20, 0.25, 0.18, 0.12]\n            \n        visitor_counts = np.random.multinomial(int(base_visitors), probs)\n        \n        for age, count in zip(ages, visitor_counts):\n            rows.append({\n                \"baseYm\": base_ym,\n                \"signguCd\": city[\"signguCd\"],\n                \"signguNm\": city[\"signguNm\"],\n                \"ageGrp\": age,\n                \"visitorCo\": count,\n                \"cityType\": city[\"type\"] # 시각화 시 그룹 필터링용\n            })\n    return pd.DataFrame(rows)\n\ndef _generate_mock_spend_div_data(base_ym: str) -> pd.DataFrame:\n    \"\"\"\n    지역별 관광 소비 다양성 Mock 데이터를 생성합니다.\n    \"\"\"\n    import numpy as np\n    np.random.seed(int(base_ym) + 1)\n    rows = []\n    industries = [\"식음료\", \"쇼핑\", \"숙박\", \"여가/레저\", \"교통\", \"문화/체험\"]\n    \n    for city in CITIES:\n        base_spend = 100000000 * city[\"spend_weight\"] # 백만원 단위\n        \n        # 도시 1은 쇼핑과 숙박, 식음료가 균형있게 발달\n        if city[\"type\"] == \"도시1\":\n            probs = [0.30, 0.30, 0.20, 0.10, 0.05, 0.05]\n        # 도시 2는 식음료에 매우 편중되고 숙박/쇼핑이 저조(관광 인프라 부족 시나리오)\n        elif city[\"type\"] == \"도시2\":\n            probs = [0.65, 0.10, 0.05, 0.10, 0.05, 0.05]\n        else:\n            probs = [0.40, 0.20, 0.15, 0.10, 0.10, 0.05]\n            \n        spend_amounts = np.random.multinomial(int(base_spend), probs)\n        \n        for ind, amount in zip(industries, spend_amounts):\n            rows.append({\n                \"baseYm\": base_ym,\n                \"signguCd\": city[\"signguCd\"],\n                \"signguNm\": city[\"signguNm\"],\n                \"indutyNm\": ind,\n                \"cardUseAmt\": amount,\n                \"cityType\": city[\"type\"]\n            })\n    return pd.DataFrame(rows)\n\ndef _generate_mock_intl_div_data(base_ym: str) -> pd.DataFrame:\n    \"\"\"\n    지역별 국제 다양성 Mock 데이터를 생성합니다.\n    \"\"\"\n    import numpy as np\n    np.random.seed(int(base_ym) + 2)\n    rows = []\n    nationalities = [\"중국\", \"일본\", \"미국\", \"대만\", \"유럽\", \"기타\"]\n    \n    for city in CITIES:\n        base_foreigner = 5000 * city[\"visit_weight\"]\n        \n        # 도시 1은 여러 국적의 외국인이 다양하게 분포 (다양성 지수 높음)\n        if city[\"type\"] == \"도시1\":\n            probs = [0.25, 0.25, 0.20, 0.15, 0.10, 0.05]\n        # 도시 2는 특정 인접국가나 단일 국적에 극도로 편중됨\n        elif city[\"type\"] == \"도시2\":\n            probs = [0.70, 0.10, 0.05, 0.05, 0.05, 0.05]\n        else:\n            probs = [0.40, 0.20, 0.15, 0.10, 0.10, 0.05]\n            \n        foreigner_counts = np.random.multinomial(int(base_foreigner), probs)\n        \n        for nat, count in zip(nationalities, foreigner_counts):\n            rows.append({\n                \"baseYm\": base_ym,\n                \"signguCd\": city[\"signguCd\"],\n                \"signguNm\": city[\"signguNm\"],\n                \"ntntyNm\": nat,\n                \"foreignerVisitorCo\": count,\n                \"cityType\": city[\"type\"]\n            })\n    return pd.DataFrame(rows)\n\ndef _generate_mock_service_demand_data(base_ym: str) -> pd.DataFrame:\n    \"\"\"\n    지역별 관광 서비스 수요 Mock 데이터를 생성합니다.\n    \"\"\"\n    import numpy as np\n    np.random.seed(int(base_ym) + 3)\n    rows = []\n    for city in CITIES:\n        # 관심도(SNS 언급량) 생성\n        sns_mention = int(10000 * city[\"sns_weight\"] * np.random.uniform(0.9, 1.1))\n        # 실제 방문지 내비게이션 검색량\n        navi_search = int(8000 * city[\"visit_weight\"] * np.random.uniform(0.9, 1.1))\n        \n        rows.append({\n            \"baseYm\": base_ym,\n            \"signguCd\": city[\"signguCd\"],\n            \"signguNm\": city[\"signguNm\"],\n            \"snsMentionCo\": sns_mention,      # SNS 언급량 (관심도)\n            \"naviSearchCo\": navi_search,      # 내비게이션 검색량 (방문도)\n            \"cityType\": city[\"type\"]\n        })\n    return pd.DataFrame(rows)\n\ndef _generate_mock_cultural_demand_data(base_ym: str) -> pd.DataFrame:\n    \"\"\"\n    지역별 문화 자원 수요 Mock 데이터를 생성합니다.\n    \"\"\"\n    import numpy as np\n    np.random.seed(int(base_ym) + 4)\n    rows = []\n    categories = [\"역사관광지\", \"자연관광지\", \"휴양관광지\", \"문화시설\", \"레저스포츠\"]\n    \n    for city in CITIES:\n        base_demand = 15000 * city[\"visit_weight\"]\n        \n        if city[\"type\"] == \"도시1\":\n            probs = [0.20, 0.20, 0.20, 0.30, 0.10]\n        elif city[\"type\"] == \"도시2\":\n            # 도시 2는 역사/자연 관광지에 몰려있고 문화시설이나 휴양 인프라가 부족한 시나리오\n            probs = [0.45, 0.40, 0.05, 0.05, 0.05]\n        else:\n            probs = [0.25, 0.25, 0.20, 0.15, 0.15]\n            \n        demand_counts = np.random.multinomial(int(base_demand), probs)\n        \n        for cat, count in zip(categories, demand_counts):\n            rows.append({\n                \"baseYm\": base_ym,\n                \"signguCd\": city[\"signguCd\"],\n                \"signguNm\": city[\"signguNm\"],\n                \"clNm\": cat,\n                \"searchCo\": count,\n                \"cityType\": city[\"type\"]\n            })\n    return pd.DataFrame(rows)\n", "pages/1_Foreigner_Trend.py": "\"\"\"\n방한 외래관광객의 상세 통계를 다각도로 분석하여 시각화하는 Streamlit 서브 페이지입니다.\n\n주요 기능:\n- 기간별(연도/월) 외래 관광객 필터링 기능\n- 입국 목적별, 성별, 연령대별 점유율 및 복합 상관관계 시각화 (Plotly 인터랙티브 차트 사용)\n- 인구통계학적 특성 요약 교차표 제시\n\"\"\"\n\nimport os\nimport sys\nimport streamlit as st\nimport pandas as pd\nimport plotly.express as px\n\n# 프로젝트 루트 경로 추가\nsys.path.append(os.path.dirname(os.path.dirname(os.path.abspath(__file__))))\n\nfrom api.odcloud_api import get_foreigner_monthly_data\n\nst.set_page_config(page_title=\"방한 외래객 트렌드 분석\", page_icon=\"📈\", layout=\"wide\")\n\nst.title(\"📈 방한 외래관광객 트렌드 분석\")\nst.markdown(\"글로벌 외래 관광객의 입국 트렌드와 인구통계학적 세그먼트 분석을 제공합니다.\")\nst.markdown(\"---\")\n\n# 데이터 불러오기\ndf_foreigner = get_foreigner_monthly_data()\n\nif not df_foreigner.empty:\n    # 연도 분리 필터 생성\n    df_foreigner[\"연도\"] = df_foreigner[\"기준연월\"].str.split(\"-\").str[0]\n    df_foreigner[\"월\"] = df_foreigner[\"기준연월\"].str.split(\"-\").str[1]\n    \n    # 사이드바 필터\n    st.sidebar.header(\"📊 데이터 필터\")\n    selected_year = st.sidebar.selectbox(\"연도 선택\", sorted(df_foreigner[\"연도\"].unique()), index=len(df_foreigner[\"연도\"].unique())-1)\n    \n    # 필터링된 데이터\n    df_filtered = df_foreigner[df_foreigner[\"연도\"] == selected_year]\n    \n    # 레이아웃 분할\n    col1, col2 = st.columns(2)\n    \n    with col1:\n        st.markdown(f\"#### 1. {selected_year}년 성별/연령대별 교차 분포\")\n        df_gender_age = df_filtered.groupby([\"연령별\", \"성별\"])[\"인원수\"].sum().reset_index()\n        fig_gender_age = px.bar(\n            df_gender_age, x=\"연령별\", y=\"인원수\", color=\"성별\",\n            title=f\"{selected_year}년 연령대별 방한 외래객 수 (성별 누적)\",\n            labels={\"인원수\": \"관광객 수(명)\", \"연령별\": \"연령대\"},\n            barmode=\"group\",\n            color_discrete_map={\"여성\": \"#FF8C94\", \"남성\": \"#61A5C2\"}\n        )\n        st.plotly_chart(fig_gender_age, use_container_width=True)\n        \n        # 교차 피봇테이블 출력\n        pivot_gender_age = df_filtered.pivot_table(index=\"연령별\", columns=\"성별\", values=\"인원수\", aggfunc=\"sum\")\n        st.markdown(\"**[인원수 상세 교차표]**\")\n        st.dataframe(pivot_gender_age.style.format(\"{:,.0f}\"))\n        \n    with col2:\n        # 국적 또는 목적별 동적 컬럼 선택\n        target_col = \"국적\" if \"국적\" in df_filtered.columns else \"목적별\"\n        st.markdown(f\"#### 2. {selected_year}년 {target_col} 점유율\")\n        df_share = df_filtered.groupby(target_col)[\"인원수\"].sum().reset_index()\n        fig_share = px.pie(\n            df_share, values=\"인원수\", names=target_col,\n            title=f\"{selected_year}년 방한 외래객 {target_col} 비율\",\n            hole=0.4,\n            color_discrete_sequence=px.colors.qualitative.Pastel\n        )\n        st.plotly_chart(fig_share, use_container_width=True)\n        \n        # 통계표 출력\n        st.markdown(f\"**[{target_col}별 관광객 통계]**\")\n        st.dataframe(df_share.sort_values(by=\"인원수\", ascending=False).style.format({\"인원수\": \"{:,.0f}\"}))\n\n    st.markdown(\"---\")\n    \n    # 다변량 시계열 분석 (월별 유입 패턴)\n    st.markdown(f\"#### 3. {selected_year}년 월별 입국 목적별 추이\")\n    df_monthly_purpose = df_filtered.groupby([\"월\", \"목적별\"])[\"인원수\"].sum().reset_index()\n    fig_monthly = px.line(\n        df_monthly_purpose, x=\"월\", y=\"인원수\", color=\"목적별\",\n        title=f\"{selected_year}년 월별 입국 목적에 따른 시계열 트렌드\",\n        labels={\"인원수\": \"관광객 수(명)\"},\n        markers=True\n    )\n    st.plotly_chart(fig_monthly, use_container_width=True)\n    \nelse:\n    st.error(\"분석할 데이터를 불러오지 못했습니다.\")\n", "pages/2_Tourism_Diversity.py": "\"\"\"\n전국 시군구 대상 온-오프라인 관광 데이터를 융합해 도시 유형을 매트릭스로 매핑하고, 비교 분석 대상 도시들을 선정하는 Streamlit 서브 페이지입니다.\n\n주요 기능:\n- 2x2 관심도(SNS 언급량) vs 실제 방문도(내비게이션 검색량) 사분면 산점도 시각화 (Plotly)\n- 사분면 경계선 가이드 제시 및 도시 분포 확인\n- 사용자의 동적 비교 대상 도시 1(성공군) 및 도시 2(잠재 개선군) 선정 기능 (st.session_state를 이용해 다른 페이지와 연동)\n\"\"\"\n\nimport os\nimport sys\nimport streamlit as st\nimport pandas as pd\nimport plotly.express as px\n\n# 프로젝트 루트 경로 추가\nsys.path.append(os.path.dirname(os.path.dirname(os.path.abspath(__file__))))\n\nfrom api.kto_api import get_area_service_demand\n\nst.set_page_config(page_title=\"관광지 관심도 vs 실제 방문 매트릭스\", page_icon=\"🧩\", layout=\"wide\")\n\nst.title(\"🧩 관심도 vs 실제 방문 매트릭스 및 도시 분류\")\nst.markdown(\"온라인 관심도(SNS 언급량)와 물리적 실제 방문량(내비게이션 검색량) 데이터를 기준으로 시군구별 위치를 확인하고 비교 분석할 도시를 선정합니다.\")\nst.markdown(\"---\")\n\n# 세션 상태 초기화 (기본 비교 대상 도시 세팅)\nif \"city_1\" not in st.session_state:\n    st.session_state.city_1 = \"서울 마포구\"\nif \"city_2\" not in st.session_state:\n    st.session_state.city_2 = \"강원 삼척시\"\n\n# 데이터 로드\ndf_demand = get_area_service_demand(\"202401\")\n\nif not df_demand.empty:\n    st.markdown(\"### 1. 시군구별 온-오프라인 매트릭스 2x2 분포\")\n    \n    # 사분면 지표 계산 (중앙값 기준)\n    median_sns = df_demand[\"snsMentionCo\"].median()\n    median_navi = df_demand[\"naviSearchCo\"].median()\n    \n    # 산점도 생성\n    fig = px.scatter(\n        df_demand, x=\"snsMentionCo\", y=\"naviSearchCo\",\n        color=\"cityType\",\n        hover_name=\"signguNm\",\n        text=\"signguNm\",\n        title=\"관광 관심도(SNS) vs 실제 방문도(내비게이션 검색)\",\n        labels={\n            \"snsMentionCo\": \"SNS 언급량 (온라인 관심도)\", \n            \"naviSearchCo\": \"내비게이션 검색수 (실제 방문도)\",\n            \"cityType\": \"도시 유형\"\n        },\n        color_discrete_map={\"도시1\": \"#E74C3C\", \"도시2\": \"#3498DB\", \"일반\": \"#95A5A6\"}\n    )\n    \n    # 텍스트 라벨 가독성 조정\n    fig.update_traces(textposition='top center', marker=dict(size=15, line=dict(width=1.5, color='black')))\n    \n    # 사분면 가이드 라인 추가\n    fig.add_vline(x=median_sns, line_width=1.5, line_dash=\"dash\", line_color=\"green\")\n    fig.add_hline(y=median_navi, line_width=1.5, line_dash=\"dash\", line_color=\"green\")\n    \n    fig.update_layout(\n        plot_bgcolor=\"rgba(240, 244, 248, 0.4)\",\n        xaxis=dict(gridcolor=\"white\"),\n        yaxis=dict(gridcolor=\"white\")\n    )\n    \n    st.plotly_chart(fig, use_container_width=True)\n    \n    # 사분면 설명 UI 구성\n    col_explain1, col_explain2 = st.columns(2)\n    with col_explain1:\n        st.markdown(f\"\"\"\n        * **🟢 수직 기준선 (SNS 중앙값)**: `{median_sns:,.0f}`\n        * **🟢 수평 기준선 (내비 중앙값)**: `{median_navi:,.0f}`\n        \"\"\")\n    with col_explain2:\n        st.markdown(\"\"\"\n        * **🔴 도시 1 영역 (우상분면)**: 관심도와 방문도 모두 높은 성공적인 관광 거점 도시\n        * **🔵 도시 2 영역 (우하분면)**: 온라인 관심은 뜨거우나 실제 방문 전환율이 저조한 잠재적 개선 도시\n        \"\"\")\n        \n    st.markdown(\"---\")\n    \n    # 비교 도시 선정 섹션\n    st.markdown(\"### 🎯 2. 인프라 심층 비교 및 벤치마킹을 위한 도시 선정\")\n    st.markdown(\"아래 드롭다운에서 비교 분석을 수행할 대상을 선택해 주세요. 선택한 정보는 다음 페이지의 1:1 정밀 비교 화면에 반영됩니다.\")\n    \n    # 도시 리스트 추출\n    city_list = sorted(df_demand[\"signguNm\"].unique().tolist())\n    \n    # selectbox로 세션 상태 갱신\n    col_select1, col_select2 = st.columns(2)\n    \n    with col_select1:\n        # 도시 1 (기본값 설정 유도)\n        default_idx1 = city_list.index(st.session_state.city_1) if st.session_state.city_1 in city_list else 0\n        selected_city1 = st.selectbox(\"📍 비교 기준 성공 도시 (도시 1 - 우상분면 권장)\", city_list, index=default_idx1)\n        st.session_state.city_1 = selected_city1\n        \n        # 선택한 도시의 간단 요약 카드\n        df_c1 = df_demand[df_demand[\"signguNm\"] == selected_city1].iloc[0]\n        st.success(f\"**{selected_city1}** ({df_c1['cityType']})\\n\\n* SNS 언급량: {df_c1['snsMentionCo']:,.0f}건\\n* 내비 검색량: {df_c1['naviSearchCo']:,.0f}건\")\n        \n    with col_select2:\n        # 도시 2\n        default_idx2 = city_list.index(st.session_state.city_2) if st.session_state.city_2 in city_list else 0\n        selected_city2 = st.selectbox(\"📍 분석 및 개선 잠재 도시 (도시 2 - 우하분면 권장)\", city_list, index=default_idx2)\n        st.session_state.city_2 = selected_city2\n        \n        # 선택한 도시의 간단 요약 카드\n        df_c2 = df_demand[df_demand[\"signguNm\"] == selected_city2].iloc[0]\n        st.info(f\"**{selected_city2}** ({df_c2['cityType']})\\n\\n* SNS 언급량: {df_c2['snsMentionCo']:,.0f}건\\n* 내비 검색량: {df_c2['naviSearchCo']:,.0f}건\")\n\n    st.markdown(\"---\")\n    st.info(\"💡 도시 선정을 마쳤다면, 왼쪽 사이드바에서 **'3_Demand_Analysis'** 페이지로 이동하여 두 도시의 1:1 비교 보고서를 확인해 보세요!\")\nelse:\n    st.error(\"데이터 로드 실패로 분석을 진행할 수 없습니다.\")\n", "pages/3_Demand_Analysis.py": "\"\"\"\n선택된 성공 도시(도시 1)와 잠재 도시(도시 2)의 인프라 및 소비 패턴을 1:1 정밀 비교하고, 데이터 기반 벤치마킹 관광 활성화 제안을 도출하는 Streamlit 서브 페이지입니다.\n\n주요 기능:\n- st.session_state 기반 선택 도시 로드 및 예외 처리\n- 5대 핵심 지표 레이더 플롯 비교 (Plotly line_polar)\n- 소비 업종 비율, 방문객 연령대 구성, 내비게이션 목적지 비중 등 1:1 비교 시각화\n- 격차 분석 결과를 기반으로 한 자동 생성형 활성화 액션 플랜 제시\n\"\"\"\n\nimport os\nimport sys\nimport streamlit as st\nimport pandas as pd\nimport numpy as np\nimport plotly.express as px\nimport plotly.graph_objects as go\n\n# 프로젝트 루트 경로 추가\nsys.path.append(os.path.dirname(os.path.dirname(os.path.abspath(__file__))))\n\nfrom api.kto_api import (\n    get_area_visitor_diversity,\n    get_area_spend_diversity,\n    get_area_intl_diversity,\n    get_area_service_demand,\n    get_area_cultural_demand\n)\n\nst.set_page_config(page_title=\"성공 도시 vs 잠재 도시 1:1 비교 분석\", page_icon=\"⚖️\", layout=\"wide\")\n\nst.title(\"⚖️ 도시 1:1 심층 비교 및 벤치마킹 제언\")\nst.markdown(\"선택된 두 도시의 관광객 특징, 카드 소비 형태, 목적지 선호도 등 세부 인프라 지표를 심층 대조하여 활성화 개선점을 도출합니다.\")\nst.markdown(\"---\")\n\n# 세션 상태 체크 및 안내\nif \"city_1\" not in st.session_state or \"city_2\" not in st.session_state:\n    st.warning(\"⚠️ 2단계 페이지('2_Tourism_Diversity')에서 분석 대상 도시를 먼저 선택해 주세요. 기본값으로 서울 마포구와 강원 삼척시를 대조군으로 분석을 로드합니다.\")\n    st.session_state.city_1 = \"서울 마포구\"\n    st.session_state.city_2 = \"강원 삼척시\"\n\ncity_1 = st.session_state.city_1\ncity_2 = st.session_state.city_2\n\nst.subheader(f\"🔍 분석 비교군: 🔴 {city_1} (기준 도시) vs 🔵 {city_2} (개선 대상 도시)\")\n\n# 데이터 통합 로드\ndf_visitor = get_area_visitor_diversity()\ndf_spend = get_area_spend_diversity()\ndf_intl = get_area_intl_diversity()\ndf_demand = get_area_service_demand()\ndf_cult = get_area_cultural_demand()\n\n# 두 도시 데이터 필터링\nv_c1 = df_visitor[df_visitor[\"signguNm\"] == city_1]\nv_c2 = df_visitor[df_visitor[\"signguNm\"] == city_2]\n\ns_c1 = df_spend[df_spend[\"signguNm\"] == city_1]\ns_c2 = df_spend[df_spend[\"signguNm\"] == city_2]\n\ni_c1 = df_intl[df_intl[\"signguNm\"] == city_1]\ni_c2 = df_intl[df_intl[\"signguNm\"] == city_2]\n\nd_c1 = df_demand[df_demand[\"signguNm\"] == city_1]\nd_c2 = df_demand[df_demand[\"signguNm\"] == city_2]\n\nc_c1 = df_cult[df_cult[\"signguNm\"] == city_1]\nc_c2 = df_cult[df_cult[\"signguNm\"] == city_2]\n\nif not d_c1.empty and not d_c2.empty:\n    st.markdown(\"### 📊 1. 5대 핵심 관광 역량 레이더 차트 비교\")\n    \n    # 레이더용 점수 산정 (Mock 가중치 기반 동적 대리치 매핑)\n    # 실제 데이터에서는 백분위 순위 등을 계산하여 매핑할 수 있습니다.\n    labels = [\"관광객 다양성\", \"소비 다양성\", \"국제 다양성\", \"SNS 언급량\", \"내비 검색량\"]\n    \n    val_c1 = [\n        0.95 if d_c1.iloc[0][\"cityType\"] == \"도시1\" else (0.45 if d_c1.iloc[0][\"cityType\"] == \"도시2\" else 0.75),\n        0.90 if d_c1.iloc[0][\"cityType\"] == \"도시1\" else (0.25 if d_c1.iloc[0][\"cityType\"] == \"도시2\" else 0.70),\n        0.92 if d_c1.iloc[0][\"cityType\"] == \"도시1\" else (0.35 if d_c1.iloc[0][\"cityType\"] == \"도시2\" else 0.65),\n        float(d_c1.iloc[0][\"snsMentionCo\"]) / 20000,\n        float(d_c1.iloc[0][\"naviSearchCo\"]) / 15000\n    ]\n    \n    val_c2 = [\n        0.95 if d_c2.iloc[0][\"cityType\"] == \"도시1\" else (0.45 if d_c2.iloc[0][\"cityType\"] == \"도시2\" else 0.75),\n        0.90 if d_c2.iloc[0][\"cityType\"] == \"도시1\" else (0.25 if d_c2.iloc[0][\"cityType\"] == \"도시2\" else 0.70),\n        0.92 if d_c2.iloc[0][\"cityType\"] == \"도시1\" else (0.35 if d_c2.iloc[0][\"cityType\"] == \"도시2\" else 0.65),\n        float(d_c2.iloc[0][\"snsMentionCo\"]) / 20000,\n        float(d_c2.iloc[0][\"naviSearchCo\"]) / 15000\n    ]\n    \n    # 1.0 초과 방지\n    val_c1 = [min(x, 1.0) for x in val_c1]\n    val_c2 = [min(x, 1.0) for x in val_c2]\n    \n    # Plotly 레이더 플롯 그리기\n    fig_radar = go.Figure()\n    fig_radar.add_trace(go.Scatterpolar(\n        r=val_c1, theta=labels, fill='toself', name=city_1, line_color='red'\n    ))\n    fig_radar.add_trace(go.Scatterpolar(\n        r=val_c2, theta=labels, fill='toself', name=city_2, line_color='blue'\n    ))\n    fig_radar.update_layout(\n        polar=dict(radialaxis=dict(visible=True, range=[0, 1])),\n        showlegend=True,\n        title=f\"{city_1} vs {city_2} 5대 차원 평가 지표\"\n    )\n    st.plotly_chart(fig_radar, use_container_width=True)\n    \n    st.markdown(\"---\")\n    \n    # 2. 소비 업종 카드 매출 분포 및 격차 비교\n    st.markdown(\"### 💳 2. 관광 카드 소비 구조 분석 (소비 인프라 격차)\")\n    \n    # 소비 정규화 비율 비교\n    s_pivot = pd.concat([s_c1, s_c2])\n    fig_spend = px.bar(\n        s_pivot, x=\"cardUseAmt\", y=\"signguNm\", color=\"indutyNm\",\n        title=\"두 도시의 관광 카드 결제 업종 구성 비교\",\n        labels={\"cardUseAmt\": \"카드 총 매출액(원)\", \"signguNm\": \"도시명\", \"indutyNm\": \"소비 업종\"},\n        orientation=\"h\",\n        color_discrete_sequence=px.colors.qualitative.Set1\n    )\n    st.plotly_chart(fig_spend, use_container_width=True)\n    \n    # 수치적 격차 분석\n    c1_total_spend = s_c1[\"cardUseAmt\"].sum()\n    c2_total_spend = s_c2[\"cardUseAmt\"].sum()\n    \n    # 식음료 비중 계산\n    c1_food_amt = s_c1[s_c1[\"indutyNm\"] == \"식음료\"][\"cardUseAmt\"].sum()\n    c1_food_ratio = (c1_food_amt / c1_total_spend) * 100 if c1_total_spend > 0 else 0\n    \n    c2_food_amt = s_c2[s_c2[\"indutyNm\"] == \"식음료\"][\"cardUseAmt\"].sum()\n    c2_food_ratio = (c2_food_amt / c2_total_spend) * 100 if c2_total_spend > 0 else 0\n    \n    # 숙박 비중 계산\n    c1_stay_amt = s_c1[s_c1[\"indutyNm\"] == \"숙박\"][\"cardUseAmt\"].sum()\n    c1_stay_ratio = (c1_stay_amt / c1_total_spend) * 100 if c1_total_spend > 0 else 0\n    \n    c2_stay_amt = s_c2[s_c2[\"indutyNm\"] == \"숙박\"][\"cardUseAmt\"].sum()\n    c2_stay_ratio = (c2_stay_amt / c2_total_spend) * 100 if c2_total_spend > 0 else 0\n\n    col_spend_stat1, col_spend_stat2 = st.columns(2)\n    with col_spend_stat1:\n        st.markdown(f\"**🔴 {city_1} 소비 특징**\")\n        st.write(f\"- 총 소비 규모: **{c1_total_spend / 100000000:.1f} 억원**\")\n        st.write(f\"- 식음료 편중률: **{c1_food_ratio:.1f}%**\")\n        st.write(f\"- 체류형 숙박 비율: **{c1_stay_ratio:.1f}%**\")\n    with col_spend_stat2:\n        st.markdown(f\"**🔵 {city_2} 소비 특징**\")\n        st.write(f\"- 총 소비 규모: **{c2_total_spend / 100000000:.1f} 억원**\")\n        st.write(f\"- 식음료 편중률: **{c2_food_ratio:.1f}%**\")\n        st.write(f\"- 체류형 숙박 비율: **{c2_stay_ratio:.1f}%**\")\n\n    st.markdown(\"---\")\n    \n    # 3. 방문객 인구통계학적 특성 및 문화 자원 비교\n    st.markdown(\"### 👥 3. 관광객 인구 세그먼트 및 선호 목적지 비교\")\n    \n    col_sub1, col_sub2 = st.columns(2)\n    \n    with col_sub1:\n        # 연령대 비교\n        v_pivot = pd.concat([v_c1, v_c2])\n        fig_vis = px.bar(\n            v_pivot, x=\"visitorCo\", y=\"signguNm\", color=\"ageGrp\",\n            title=\"방문객 연령대 분포 비교\",\n            labels={\"visitorCo\": \"방문객 수(명)\", \"signguNm\": \"도시명\", \"ageGrp\": \"연령대\"},\n            orientation=\"h\",\n            color_discrete_sequence=px.colors.qualitative.Set3\n        )\n        st.plotly_chart(fig_vis, use_container_width=True)\n        \n    with col_sub2:\n        # 문화 자원 비교\n        c_pivot = pd.concat([c_c1, c_c2])\n        fig_cult = px.bar(\n            c_pivot, x=\"searchCo\", y=\"signguNm\", color=\"clNm\",\n            title=\"내비게이션 목적지 카테고리 비교\",\n            labels={\"searchCo\": \"목적지 검색수\", \"signguNm\": \"도시명\", \"clNm\": \"목적지 분류\"},\n            orientation=\"h\",\n            color_discrete_sequence=px.colors.qualitative.Accent\n        )\n        st.plotly_chart(fig_cult, use_container_width=True)\n\n    st.markdown(\"---\")\n    \n    # 4. 데이터 기반 벤치마킹 및 활성화 대안 제언 (5단계의 핵심 결과물)\n    st.markdown(\"### 💡 4. 데이터 기반 벤치마킹 제언 리포트\")\n    \n    # 동적 격차 분석 문장 생성\n    food_gap = c2_food_ratio - c1_food_ratio\n    stay_gap = c1_stay_ratio - c2_stay_ratio\n    \n    st.success(f\"\"\"\n    #### ✍️ {city_2} 관광 활성화를 위한 성공 도시 {city_1} 벤치마킹 보고서\n    \n    1. **식음료 편중 완화 및 복합 상권 개발 (맛집 연계 쇼핑 인프라)**\n       - 분석 결과, {city_2}의 식음료 소비 비중은 **{c2_food_ratio:.1f}%**로, {city_1}의 **{c1_food_ratio:.1f}%** 대비 **{food_gap:.1f}%p 높은 극단적 편중** 현상을 보이고 있습니다.\n       - 단순 식사 소비에 그치지 않고 소비가 지역 내로 분산될 수 있도록, 대표 맛집 주변 반경 500m 이내에 지역 고유의 공방, 청년 창업 매장, 기념품 숍을 배치하여 동선 내 **'로컬 쇼핑 상권' 연계**를 구축해야 합니다.\n       \n    2. **체류 여건 보완 및 다각적 야간 콘텐츠 활성화 (숙박 유도)**\n       - {city_1}은 전체 소비 중 **{c1_stay_ratio:.1f}%**가 숙박 업종에서 이루어져 높은 체류성 소비를 생산하는 반면, {city_2}은 **{c2_stay_ratio:.1f}%** 수준에 머물러 관광객이 체류하지 않고 당일로 이탈하고 있습니다.\n       - {city_1}의 감성 한옥스테이나 도심형 게스트하우스 모델을 벤치마킹하여, 지역 유휴 자원을 활용한 **감성 숙박(스테이) 클러스터**를 보급하고, 야간 경관 미술관이나 야간 푸드 마켓 등을 개방하여 머무를 수 있는 밤 문화를 개발해야 합니다.\n       \n    3. **내비게이션 행선지 다양화 (문화/체험 시설 확대)**\n       - 내비게이션 목적지 검색 비교 결과, {city_2}은 역사나 자연관광지의 단순 자연 경관 감상 비중이 압도적인 반면, {city_1}은 복합 문화시설 및 스포츠여가 검색 비중이 뚜렷합니다.\n       - 자연 자원을 보유한 {city_2}의 장점을 극대화하되, 실내 미디어 아트 센터, 복합 문화 체험 공간 등을 결합하여 기후 영향 없이 4계절 내내 방문객을 흡수할 수 있는 하이브리드 관광 복합 공간 확충이 요구됩니다.\n    \"\"\")\nelse:\n    st.error(\"도시 정보를 비교하기 위한 통계 데이터가 부족합니다.\")\n", ".env": "ODCLOUD_API_KEY=\nKTO_API_KEY=\n"}
      }, document.getElementById("root"));
